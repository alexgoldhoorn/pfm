repos:
  # Blocks real personal financial data reaching this public repo. Runs first
  # so a privacy failure is the first thing reported, not buried under
  # formatting noise.
  - repo: local
    hooks:
      - id: no-real-financials
        name: no real financial data
        entry: python3 scripts/check_no_real_financials.py
        language: system
        pass_filenames: true

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3.13
        args: [--line-length=88]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --extend-ignore=E203,W503,E501

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        args:
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --in-place
